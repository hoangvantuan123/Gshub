# Air configuration file for Gshub Service Root
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main.exe ./service-datahub/cmd/server/main.go"
  bin = "./tmp/main.exe"
  full_bin = ""
  include_ext = ["go", "tpl", "tmpl", "html", "env"]
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "note"]
  include_dir = ["service-datahub"]
  delay = 1000
  stop_on_error = true
  log = "air.log"

[log]
  time = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
