syntax = "proto3";

package datahub;

option go_package = "service-datahub/pb/datahub";

// ==========================================
// 1. Auth & Session Messages
// ==========================================

message LoginProtoRequest {
  string username = 1;
  string password = 2;
  string config_key = 3;
}

message TokenSessionProto {
  uint32 id = 1;
  string config_key = 2;
  string username = 3;
  string access_token = 4;
  string token_type = 5;
  string refresh_token = 6;
  int64 expires_in = 7;
  string expires_at = 8;
  string scope = 9;
  string created_at = 10;
  string updated_at = 11;
}

message LoginProtoResponse {
  bool success = 1;
  string config_key = 2;
  string username = 3;
  string access_token = 4;
  string token_type = 5;
  int64 expires_in = 6;
  string expires_at = 7;
  string scope = 8;
  TokenSessionProto session = 9;
  string error_message = 10;
}

message SessionProtoRequest {
  string config_key = 1;
  string username = 2;
}

message SessionProtoResponse {
  bool success = 1;
  TokenSessionProto session = 2;
  string error_message = 3;
}
