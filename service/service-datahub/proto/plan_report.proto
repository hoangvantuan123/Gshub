syntax = "proto3";

package datahub;

option go_package = "service-datahub/pb/datahub";

// ==========================================
// 1. Plan Master (Đăng ký báo cáo) Proto Messages
// ==========================================

message PlanMasterProtoItem {
  int64 id_seq = 1;
  string reg_code = 2;
  string report_type = 3;
  string factory_name = 4;
  string apply_date = 5;
  string remark = 6;
  string status = 7;
  int32 total_rows = 8;
  int64 row_version = 9;
  bool is_active = 10;
  string created_by = 11;
  string created_by_name = 12;
  string created_at = 13;
  string updated_by = 14;
  string updated_by_name = 15;
  string updated_at = 16;
}

message PlanMasterProtoRequest {
  string reg_code = 1;
  string report_type = 2;
  string factory_name = 3;
  string apply_date = 4;
  string apply_date_from = 5;
  string apply_date_to = 6;
  string status = 7;
  string is_active = 8;
  int32 page = 9;
  int32 page_size = 10;
  string sort_field = 11;
  string sort_order = 12;
}

message PlanMasterProtoResponse {
  bool success = 1;
  string message = 2;
  repeated PlanMasterProtoItem data = 3;
  int64 total_records = 4;
  int64 total_all = 5;
  int32 total_pages = 6;
  int32 page = 7;
  int32 page_size = 8;
  string error_message = 9;
}

// ==========================================
// 2. KHSX Detail (Chi tiết kế hoạch điều phối 24 cột)
// ==========================================

message PlanDetailProtoItem {
  int64 id_seq = 1;
  int64 master_seq = 2;
  string reg_code = 3;
  int32 row_seq = 4;
  string working_tag = 5;
  string pic_dp = 6;
  string operation_no = 7;
  string op_date = 8;
  string routing_doc_no = 9;
  string routing_doc_date = 10;
  string item_code = 11;
  string item_name = 12;
  string operation_name = 13;
  string op_type_name = 14;
  string machine_name = 15;
  string unit = 16;
  string target_pass_qty = 17;
  string target_prod_qty = 18;
  string stat_pass_qty = 19;
  string start_time = 20;
  string end_time = 21;
  string standard_prod_time = 22;
  string actual_prod_time = 23;
  string standard_capa = 24;
  string actual_capa = 25;
  string status_dp_sx = 26;
  string time_status = 27;
  string capa_status = 28;
  string user_memo = 29;
  int64 row_version = 30;
  bool is_active = 31;
}

message PlanDetailProtoRequest {
  int64 master_seq = 1;
  string reg_code = 2;
  string item_code = 3;
  string operation_no = 4;
  string routing_doc_no = 5;
  string op_date = 6;
  string machine_name = 7;
  int32 page = 8;
  int32 page_size = 9;
  string sort_field = 10;
  string sort_order = 11;
}

message PlanDetailProtoResponse {
  bool success = 1;
  string message = 2;
  repeated PlanDetailProtoItem data = 3;
  int64 total_records = 4;
  int64 total_all = 5;
  int32 total_pages = 6;
  int32 page = 7;
  int32 page_size = 8;
  string error_message = 9;
}

